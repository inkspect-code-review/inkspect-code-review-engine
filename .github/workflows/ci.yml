name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.94.1-${{ hashFiles('Cargo.lock') }}
      - run: cargo +1.94.1 test --locked
      - run: cargo +1.94.1 build --locked
      - run: ./target/debug/inkspect-engine --help
      - run: ./target/debug/inkspect-engine local --help
      - run: ./target/debug/inkspect-engine setup --help
      - run: ./target/debug/inkspect-engine with-provider --help
      - run: ./target/debug/inkspect-engine prepare-job --help
      - run: sh -n scripts/ai-setup.sh
      - name: Validate Compose
        if: runner.os == 'Linux'
        run: docker compose --profile review --profile context config --quiet
  title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check conventional title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)\([a-z0-9-]+\)!?: [a-z].+$'
          if [[ ! "$PR_TITLE" =~ $pattern || ${#PR_TITLE} -gt 72 || "$PR_TITLE" == *. || "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* ]]; then
            printf '%s\n' 'Use type(scope): short imperative description (max 72 characters).' >&2
            exit 1
          fi
