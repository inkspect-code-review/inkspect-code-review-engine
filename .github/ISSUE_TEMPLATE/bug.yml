name: Bug report
description: Report a reproducible engine problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Never include keys or private source. Report security issues using SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example with credentials removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engine version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture and provider
      placeholder: "Linux x86_64, OpenAI (no key)"
  - type: textarea
    id: logs
    attributes:
      label: Redacted error output
      render: text
